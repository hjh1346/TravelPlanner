<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">
        <div>
            <h1>✈️ Travel Planner</h1>
            <p>나만의 여행 일정을 만들어보세요</p>
        </div>
    </header>

    <main class="container">

        <section class="trip-section">

            <div class="section-title">
                <h2>내 여행</h2>

                <button class="new-trip-btn">
                    + 새 여행
                </button>
            </div>

            <div class="trip-card">

                <div class="trip-icon">
                    🇯🇵
                </div>

                <div class="trip-info">
                    <h3>도쿄 3박 4일</h3>

                    <p>
                        2026.10.10 ~ 2026.10.13
                    </p>

                    <span>
                        일정 0개
                    </span>
                </div>

            </div>

        </section>

    </main>
<script src="app.js"></script>
</body>
</html>
